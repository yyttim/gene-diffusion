# GeneDiffusion 小型模型配置
# 小参数量模型（~10M参数）但使用全量数据（3.45M样本）进行测试

# 数据配置 - 保持全量数据
data:
  data_dir: "datasets/genomics_seq"
  seq_length: 10000  # 10kb序列
  overlap: 0.8       # 80%重叠的滑动窗口
  
  # 平衡采样核心参数 - 保持全量
  max_sequences_per_species: 15000  # 每个物种15,000个片段
  
  # 批次配置 - 增大批次以加快训练
  train_batch_size: 256   # 增大批次
  eval_batch_size: 512
  num_workers: 16
  
  # 使用所有230个物种
  species_list: null

# 模型配置 - 小型化
model:
  # 核心参数（显著减小）
  hidden_size: 256      # 768 -> 256 (减少3倍)
  num_layers: 4         # 12 -> 4 (减少3倍)
  num_heads: 4          # 12 -> 4
  intermediate_size: 1024  # 3072 -> 1024
  
  # 词汇表和物种数保持不变
  vocab_size: 4099     # 4096个6-mer + 3个特殊token
  num_species: 230     # 230个哺乳动物物种
  
  # 物种感知组件
  use_species_aware: true
  species_embed_dim: 64   # 128 -> 64 (减半)
  use_film: true
  
  # 扩散配置
  max_timesteps: 1000
  mask_ratio_min: 0.15
  mask_ratio_max: 0.85
  
  # 生物学约束权重
  orf_weight: 1.0
  gc_weight: 0.5
  complexity_weight: 0.3
  
# 训练配置 - 调整以适应小模型
training:
  num_epochs: 50    # 减少epoch数以加快测试
  gradient_accumulation_steps: 2  # 有效批次大小 = 256 * 2 = 512
  
  # 学习率调度 - 稍微提高学习率
  learning_rate: 2e-4   # 提高学习率
  lr_scheduler: "cosine"
  warmup_steps: 5000    # 减少warmup步数
  
  # 优化器
  optimizer: "adamw"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  
  # 梯度裁剪
  max_grad_norm: 1.0
  
  # 检查点 - 更频繁保存
  save_steps: 2000    # 更频繁保存
  eval_steps: 500     # 更频繁评估
  logging_steps: 50   # 更频繁记录
  
  # 混合精度训练
  fp16: true
  
# 分布式训练
distributed:
  enabled: true
  backend: "nccl"
  
# 日志配置
logging:
  use_wandb: true
  project_name: "gene-diffusion-small"
  run_name: "small_model_full_data_test"
  log_interval: 50

# 评估配置
evaluation:
  balanced_eval: true
  eval_species: ["homo_sapiens", "mus_musculus", "bos_taurus", "felis_catus", "equus_caballus"]
  num_eval_samples_per_species: 100

# 模型参数估算
# 嵌入层: 4099 * 256 ≈ 1.05M
# 物种嵌入: 230 * 64 ≈ 0.01M
# Transformer层: 4 * (256^2 * 4 + 256 * 1024 * 2) ≈ 4 * 0.8M ≈ 3.2M
# 输出层: 256 * 4099 ≈ 1.05M
# 其他参数: ~0.5M
# 总计: ~6-7M 参数

# 训练规模
# 230个物种 × 15,000个片段/物种 = 3,450,000 (3.45M) 训练样本
# 每个epoch: 3.45M / 256 ≈ 13,477步
# 50个epochs ≈ 674K训练步 