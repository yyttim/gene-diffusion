# GeneDiffusion 2B参数大模型配置
# 大规模生物基础模型（~2B参数）

# 数据配置 - 保持全量数据
data:
  data_dir: "datasets/genomics_seq"
  seq_length: 10000  # 10kb序列
  overlap: 0.8       # 80%重叠的滑动窗口
  
  # 平衡采样核心参数 - 保持全量
  max_sequences_per_species: 15000  # 每个物种15,000个片段
  
  # 批次配置 - 大模型使用较小批次
  train_batch_size: 32    # 减小批次以适应大模型
  eval_batch_size: 64
  num_workers: 16
  
  # 使用所有230个物种
  species_list: null

# 模型配置 - 2B参数规模
model:
  # 核心参数（大幅增加）
  hidden_size: 2048      # 256 -> 2048 (8倍)
  num_layers: 24         # 4 -> 24 (6倍)
  num_heads: 32          # 4 -> 32 (8倍)
  intermediate_size: 8192  # 1024 -> 8192 (8倍)
  
  # 词汇表和物种数保持不变
  vocab_size: 4099     # 4096个6-mer + 3个特殊token
  num_species: 230     # 230个哺乳动物物种
  
  # 物种感知组件
  use_species_aware: true
  species_embed_dim: 256   # 增加物种嵌入维度
  use_film: true
  
  # 扩散配置
  max_timesteps: 1000
  mask_ratio_min: 0.15
  mask_ratio_max: 0.85
  
  # 生物学约束权重
  orf_weight: 1.0
  gc_weight: 0.5
  complexity_weight: 0.3
  
  # 额外的模型配置
  dropout: 0.1
  attention_dropout: 0.1
  hidden_dropout: 0.1
  
# 训练配置 - 适应大模型
training:
  num_epochs: 100    # 大模型需要更多训练
  gradient_accumulation_steps: 16  # 有效批次大小 = 32 * 16 = 512
  
  # 学习率调度 - 大模型使用更小的学习率
  learning_rate: 1e-4   
  lr_scheduler: "cosine"
  warmup_steps: 10000    # 更长的warmup
  
  # 优化器
  optimizer: "adamw"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  
  # 梯度裁剪
  max_grad_norm: 1.0
  
  # 检查点 - 大模型需要更频繁保存
  save_steps: 5000    
  eval_steps: 1000     
  logging_steps: 100   
  
  # 混合精度训练
  fp16: true
  gradient_checkpointing: true  # 启用梯度检查点以节省内存
  
# 分布式训练
distributed:
  enabled: true
  backend: "nccl"
  
# 日志配置
logging:
  use_wandb: true
  project_name: "gene-diffusion-2b"
  run_name: "2b_model_full_data"
  log_interval: 100

# 评估配置
evaluation:
  balanced_eval: true
  eval_species: ["homo_sapiens", "mus_musculus", "bos_taurus", "felis_catus", "equus_caballus"]
  num_eval_samples_per_species: 100

# 模型参数估算
# 嵌入层: 4099 * 2048 ≈ 8.4M
# 物种嵌入: 230 * 256 + 2 * 230 * 2048 ≈ 1M 
# Annotation编码器: 4层 * ~20M ≈ 80M
# Transformer层: 24 * ~80M ≈ 1920M (1.92B)
# 输出层: 2048 * 4099 ≈ 8.4M
# 其他参数: ~50M
# 总计: ~2B 参数

# 训练规模
# 230个物种 × 15,000个片段/物种 = 3,450,000 (3.45M) 训练样本
# 每个epoch: 3.45M / 32 ≈ 107,813步
# 100个epochs ≈ 10.8M训练步

# 硬件需求
# GPU内存: 建议使用8个A100 80GB进行训练
# 单个GPU需要: ~60GB显存（使用梯度检查点）
# 训练时间: 每个epoch约12小时 