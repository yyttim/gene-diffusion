# GeneDiffusion 平衡训练配置
# 确保每个物种使用相同数量的训练数据

# 数据配置
data:
  data_dir: "/home/share/huadjyin/home/liwenbo/projects/geno/data/genomics_seq"
  seq_length: 10000  # 10kb序列
  overlap: 0.8       # 80%重叠的滑动窗口
  
  # 平衡采样核心参数
  max_sequences_per_species: 15000  # 每个物种15,000个片段
  # 注意：实际每个物种的片段数会是所有物种中最少片段数和此参数的较小值
  # 例如：如果最少的物种只有10,000个片段，那么所有物种都会采样10,000个
  
  # 批次配置
  train_batch_size: 128
  eval_batch_size: 256
  num_workers: 16
  
  # 物种列表（None表示使用所有可用物种）
  species_list: null  # 使用所有230个物种

# 模型配置
model:
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  intermediate_size: 3072
  vocab_size: 4099     # 4096个6-mer + 3个特殊token
  num_species: 230     # 230个哺乳动物物种
  
  # 物种感知组件
  use_species_aware: true
  species_embed_dim: 128
  use_film: true  # 使用FiLM进行物种条件化
  
  # 扩散配置
  max_timesteps: 1000
  mask_ratio_min: 0.15
  mask_ratio_max: 0.85
  
  # 生物学约束权重
  orf_weight: 1.0
  gc_weight: 0.5
  complexity_weight: 0.3
  
# 训练配置
training:
  num_epochs: 100
  gradient_accumulation_steps: 4  # 有效批次大小 = 128 * 4 = 512
  
  # 学习率调度
  learning_rate: 1e-4
  lr_scheduler: "cosine"
  warmup_steps: 10000
  
  # 优化器
  optimizer: "adamw"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  
  # 梯度裁剪
  max_grad_norm: 1.0
  
  # 检查点
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 100
  
  # 混合精度训练
  fp16: true
  
# 分布式训练
distributed:
  enabled: true
  backend: "nccl"
  
# 日志配置
logging:
  use_wandb: true
  project_name: "gene-diffusion-balanced"
  run_name: "balanced_230species_3.45M"
  log_interval: 100

# 评估配置
evaluation:
  # 确保验证集也使用平衡采样
  balanced_eval: true
  eval_species: ["homo_sapiens", "mus_musculus", "bos_taurus", "felis_catus", "equus_caballus"]
  num_eval_samples_per_species: 100  # 每个物种100个验证样本
  
# 估算的训练规模
# 230个物种 × 15,000个片段/物种 = 3,450,000 (3.45M) 训练样本
# 每个epoch: 3.45M / 128 ≈ 26,953步
# 100个epochs ≈ 2.7M训练步 